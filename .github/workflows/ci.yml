name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[local,dev,app]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit + end-to-end tests (local Spark, synthetic fleet)
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: pytest -q
      - name: Build wheel
        run: python -m build --wheel
      - name: Validate bundle YAML
        run: python -c "import yaml,glob; [yaml.safe_load(open(f)) for f in ['databricks.yml', *glob.glob('resources/*.yml')]]; print('bundle yaml ok')"
      - uses: actions/upload-artifact@v4
        with:
          name: driveguard-wheel
          path: dist/*.whl

  # Deploys the bundle when workspace credentials are configured as repository secrets.
  # Skipped on forks / without secrets, so CI stays green for anyone who clones the repo.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && vars.DATABRICKS_HOST != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build
      - uses: databricks/setup-cli@main
      - name: Deploy bundle (dev target)
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle validate -t dev
          databricks bundle deploy -t dev
