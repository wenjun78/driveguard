name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[local,dev,app]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit + end-to-end tests (local Spark, synthetic fleet)
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: pytest -q
      - name: Build wheel
        run: python -m build --wheel
      - name: Validate bundle YAML
        run: python -c "import yaml,glob; [yaml.safe_load(open(f)) for f in ['databricks.yml', *glob.glob('resources/*.yml')]]; print('bundle yaml ok')"
      - uses: actions/upload-artifact@v5
        with:
          name: driveguard-wheel
          path: dist/*.whl

  # Keeps the deployed bundle in step with main when workspace credentials are configured.
  # Skipped on forks / without secrets, so CI stays green for anyone who clones the repo.
  # Data loading and the first run are the databricks-bootstrap workflow; daily operation is the daily workflow.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST || secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      # `secrets` cannot be used in a job-level `if`, so the check happens here and later steps key off it
      - name: Skip when Databricks is not configured
        id: cfg
        run: |
          if [ -z "$DATABRICKS_HOST" ] || [ -z "$DATABRICKS_TOKEN" ]; then echo "configured=false" >> "$GITHUB_OUTPUT"; echo "Databricks not configured; skipping deploy."; else echo "configured=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v5
        if: steps.cfg.outputs.configured == 'true'
      - uses: actions/setup-python@v6
        if: steps.cfg.outputs.configured == 'true'
        with:
          python-version: "3.11"
      - run: pip install build
        if: steps.cfg.outputs.configured == 'true'
      - uses: databricks/setup-cli@main
        if: steps.cfg.outputs.configured == 'true'
      - name: Deploy bundle (live target)
        if: steps.cfg.outputs.configured == 'true'
        run: |
          databricks bundle validate -t live --var="replay_anchor=${{ vars.DG_REPLAY_ANCHOR || secrets.DG_REPLAY_ANCHOR }}"
          databricks bundle deploy -t live --var="replay_anchor=${{ vars.DG_REPLAY_ANCHOR || secrets.DG_REPLAY_ANCHOR }}"
