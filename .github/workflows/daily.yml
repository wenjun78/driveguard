# The daily operation, driven from GitHub: run the Databricks daily job (ingest -> features -> score -> monitor ->
# condition -> retrain), export a fresh console snapshot from the live workspace to the `snapshot` branch, and - only
# when the champion model version changed - commit the new snapshot plus the docs rewritten by
# scripts/refresh_docs.py to main, so README and case study always describe the model scoring the fleet.
# Skips quietly when the Databricks secrets are not configured.
name: daily

on:
  schedule:
    - cron: "40 2 * * *" # 02:40 UTC = 10:40 MYT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: databricks
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST || secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DG_CATALOG: workspace
      DG_SCHEMA: driveguard
      DG_REPLAY_ANCHOR: ${{ vars.DG_REPLAY_ANCHOR || secrets.DG_REPLAY_ANCHOR }}
      MLFLOW_DISABLE_AGENT_HINT: "1"
      MLFLOW_TRACKING_URI: databricks
      MLFLOW_REGISTRY_URI: databricks-uc
    steps:
      - name: Skip when Databricks is not configured
        id: cfg
        run: |
          if [ -z "$DATABRICKS_HOST" ] || [ -z "$DATABRICKS_TOKEN" ]; then echo "configured=false" >> "$GITHUB_OUTPUT"; echo "Databricks not configured; nothing to do."; else echo "configured=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v5
        if: steps.cfg.outputs.configured == 'true'
      - uses: actions/setup-python@v6
        if: steps.cfg.outputs.configured == 'true'
        with:
          python-version: "3.11"
          cache: pip
      - uses: ./.github/actions/setup-databricks-cli
        if: steps.cfg.outputs.configured == 'true'
      - name: Install
        if: steps.cfg.outputs.configured == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[app]" build
      - name: Workspace info
        if: steps.cfg.outputs.configured == 'true'
        id: info
        run: python scripts/databricks_bootstrap.py info
      - name: Deploy bundle (picks up code changes)
        if: steps.cfg.outputs.configured == 'true'
        run: databricks bundle deploy -t live --var="replay_anchor=${{ vars.DG_REPLAY_ANCHOR || secrets.DG_REPLAY_ANCHOR }}"
      - name: Run the daily job
        if: steps.cfg.outputs.configured == 'true'
        run: databricks bundle run -t live driveguard_daily --var="replay_anchor=${{ vars.DG_REPLAY_ANCHOR || secrets.DG_REPLAY_ANCHOR }}"
      - name: Export console snapshot
        if: steps.cfg.outputs.configured == 'true'
        id: export
        env:
          DATABRICKS_HTTP_PATH: ${{ vars.DATABRICKS_HTTP_PATH || secrets.DATABRICKS_HTTP_PATH || steps.info.outputs.http_path }}
        run: |
          if [ -z "$DATABRICKS_HTTP_PATH" ]; then echo "::warning::no SQL warehouse; skipping snapshot"; exit 0; fi
          before=$(python -c "import json;print(json.load(open('app_snapshot/model.json'))['champion']['version'])")
          python scripts/export_snapshot.py --source databricks --out app_snapshot
          after=$(python -c "import json;print(json.load(open('app_snapshot/model.json'))['champion']['version'])")
          echo "champion_before=$before" >> "$GITHUB_OUTPUT"; echo "champion_after=$after" >> "$GITHUB_OUTPUT"
          echo "champion: v$before -> v$after"
      - name: New champion -> refresh docs and commit snapshot to main
        if: steps.cfg.outputs.configured == 'true' && steps.export.outputs.champion_after != '' && steps.export.outputs.champion_before != steps.export.outputs.champion_after
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          python scripts/refresh_docs.py
          git config user.name "wenjun78"; git config user.email "151641864+wenjun78@users.noreply.github.com"
          git add app_snapshot README.md PROJECT_CASE_STUDY.md
          printf '%s\n\n%s\n' "New champion v${{ steps.export.outputs.champion_after }}: refresh bundled snapshot and docs" \
            "Automated by the daily workflow: scripts/refresh_docs.py rewrote every marked figure in README.md and PROJECT_CASE_STUDY.md from the exported console snapshot." > /tmp/msg
          git commit -qF /tmp/msg
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
      - name: Publish snapshot branch (single commit, force-pushed; the console fetches it)
        if: steps.cfg.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          test -f app_snapshot/overview.json
          d=$(mktemp -d); cp -r app_snapshot "$d/"; cd "$d"
          git init -q -b snapshot
          git config user.name "wenjun78"; git config user.email "151641864+wenjun78@users.noreply.github.com"
          git add app_snapshot && git commit -qm "Console snapshot $(date -u +%Y-%m-%dT%H:%MZ) from the live workspace"

          # GitHub can reject writes transiently (e.g. remote 'fatal error in commit_refs').
          # A persistent rejection still fails the run, so stale snapshots are visible.
          for attempt in 1 2 3; do
            if git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:snapshot; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then echo "::error::Failed to publish snapshot after 3 attempts"; exit 1; fi
            echo "::warning::Snapshot push failed (attempt $attempt); retrying"
            sleep $((10 * attempt))
          done
